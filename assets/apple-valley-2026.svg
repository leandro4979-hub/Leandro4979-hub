<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">Leandro Fajardo — Apple Valley, California — 2026</title>
<desc id="desc">Dark technology banner with cyan orbital geometry above a warm desert horizon. Private intelligence. Human authority. Verifiable action.</desc>
