<text x="80" y="82" fill="#5eead4" font-size="17" letter-spacing="4">INDEPENDENT BUILDER / 2026</text>
<text x="76" y="182" fill="#f3f6fa" font-size="68" font-weight="700" letter-spacing="-2">LEANDRO FAJARDO</text>
<text x="80" y="240" fill="#c2d0dd" font-size="26">From the High Desert. Toward what comes next.</text>
<text x="80" y="313" fill="#f3f6fa" font-size="20">PRIVATE INTELLIGENCE.</text>
<text x="80" y="347" fill="#f3f6fa" font-size="20">HUMAN AUTHORITY.</text>
<text x="80" y="381" fill="#f3f6fa" font-size="20">VERIFIABLE ACTION.</text>
<text x="80" y="516" fill="#fbbf84" font-size="16" letter-spacing="3">APPLE VALLEY, CALIFORNIA</text>
<text x="1160" y="516" fill="#9cb6c4" font-size="14" letter-spacing="2">BUILD → VERIFY</text>
