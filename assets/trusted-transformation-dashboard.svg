<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="title desc">
<title id="title">Trusted Transformation Infrastructure executive portfolio dashboard</title>
<desc id="desc">Premium dark glass portfolio dashboard for Leandro Fajardo featuring three venture concepts, executive summary, proof layer, case study, insights, collaboration and originator information.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03090d"/><stop offset="0.52" stop-color="#071a28"/><stop offset="1" stop-color="#051019"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1720"/><stop offset="0.5" stop-color="#0c2635"/><stop offset="1" stop-color="#09131d"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c66b"/><stop offset="1" stop-color="#ffe3a0"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d4035"/><stop offset="1" stop-color="#09241f"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34244a"/><stop offset="1" stop-color="#14172b"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173850"/><stop offset="1" stop-color="#0a1b28"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".42"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{fill:#aab7c2}.white{fill:#f7fbff}.gold{fill:#f6c66b}.cyan{fill:#6be7ff}.green{fill:#77f0b1}.purple{fill:#d4a6ff}.small{font-size:13px}.body{font-size:15px}.label{font-size:12px;font-weight:700;letter-spacing:1.2px}.h2{font-size:22px;font-weight:800}.h3{font-size:18px;font-weight:800}.stroke{stroke:#90a4b3;stroke-opacity:.32}.glass{fill:#102330;fill-opacity:.84;stroke:#b9d2df;stroke-opacity:.34}.pill{fill:#ffffff;fill-opacity:.06;stroke:#ffffff;stroke-opacity:.14}
  </style>
</defs>
<rect width="1200" height="1440" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="1438" rx="27" fill="none" stroke="#a7c2cf" stroke-opacity=".7"/>
<circle cx="975" cy="160" r="250" fill="#0a5680" opacity=".12"/><circle cx="120" cy="980" r="300" fill="#115c48" opacity=".08"/>

<!-- Header -->
<g class="sans">
  <text x="42" y="62" font-size="38" font-weight="800" fill="url(#gold)">TT</text>
  <text x="102" y="45" class="white label">TRUSTED TRANSFORMATION</text><text x="102" y="63" class="white label">INFRASTRUCTURE</text>
  <text x="405" y="52" class="gold label">HOME</text><text x="495" y="52" class="white label">CONCEPTS</text><text x="598" y="52" class="white label">CASE STUDIES</text><text x="735" y="52" class="white label">INSIGHTS</text><text x="825" y="52" class="white label">ABOUT</text><text x="900" y="52" class="white label">COLLABORATION</text>
  <rect x="1060" y="25" width="100" height="38" rx="9" fill="#172630" stroke="#f6c66b" stroke-opacity=".65"/><text x="1084" y="49" class="gold label">CONTACT</text>
</g>

<!-- Hero -->
<rect x="32" y="85" width="1136" height="330" rx="24" fill="url(#hero)" stroke="#8da5b4" stroke-opacity=".22" filter="url(#shadow)"/>
<path d="M34 414 C210 320 340 355 510 280 C680 205 800 230 1166 116" fill="none" stroke="#f6c66b" stroke-opacity=".12" stroke-width="2"/>
<g class="serif white"><text x="48" y="170" font-size="48">Building the Trusted</text><text x="48" y="226" font-size="48">Infrastructure for</text><text x="48" y="282" font-size="48">Transformable Futures.</text></g>
<g class="sans"><line x1="48" y1="315" x2="110" y2="315" stroke="#f6c66b" stroke-width="2"/><text x="48" y="345" class="white body">Three ventures. One infrastructure.</text><text x="48" y="369" class="gold body" font-weight="700">Trust • Transparency • Transformation</text><rect x="48" y="386" width="208" height="0" rx="8" fill="none"/>
<rect x="48" y="380" width="208" height="0" opacity="0"/>
</g>

<!-- Executive summary -->
<rect x="735" y="100" width="405" height="275" rx="20" class="glass" filter="url(#shadow)"/>
<g class="sans"><text x="756" y="132" class="white h2">EXECUTIVE SUMMARY</text><text x="756" y="153" class="muted small">Manager Snapshot</text>
<line x1="756" y1="168" x2="1118" y2="168" stroke="#d7e6ef" stroke-opacity=".25"/>
<text x="758" y="197" class="green label">↗ OPPORTUNITY</text><text x="758" y="219" class="white small">Three distinct ventures with a</text><text x="758" y="237" class="white small">shared control + verification layer.</text>
<text x="943" y="197" class="gold label">△ RISK</text><text x="943" y="219" class="white small">Technical validation, adoption,</text><text x="943" y="237" class="white small">and partner fit remain open.</text>
<line x1="927" y1="178" x2="927" y2="254" stroke="#d7e6ef" stroke-opacity=".16"/><line x1="756" y1="254" x2="1118" y2="254" stroke="#d7e6ef" stroke-opacity=".16"/>
<text x="758" y="282" class="cyan label">✓ READINESS</text><text x="758" y="304" class="white small">Portfolio architecture and pilot</text><text x="758" y="322" class="white small">paths are defined.</text>
<text x="943" y="282" class="purple label">↗ NEXT MILESTONE</text><text x="943" y="304" class="white small">Build and validate the first</text><text x="943" y="322" class="white small">real-world pilot.</text>
</g>

<!-- Ventures -->
<g class="sans"><text x="42" y="452" class="gold h2">THE THREE VENTURES</text><line x1="255" y1="445" x2="315" y2="445" stroke="#f6c66b" stroke-opacity=".7"/></g>
<g filter="url(#shadow)">
<rect x="34" y="472" width="282" height="190" rx="18" fill="url(#green)" stroke="#62db9f" stroke-opacity=".48"/>
<rect x="322" y="472" width="282" height="190" rx="18" fill="url(#purple)" stroke="#c89aff" stroke-opacity=".36"/>
<rect x="610" y="472" width="282" height="190" rx="18" fill="url(#blue)" stroke="#63c5ff" stroke-opacity=".40"/>
</g>
<g class="sans">
<circle cx="84" cy="525" r="28" fill="#08251c" stroke="#65e9a3"/><text x="71" y="532" class="green h3">◇</text><text x="128" y="506" class="green label">HYPER-LOCAL</text><text x="128" y="526" class="white h3">MICRO-MANUFACTURING</text><text x="55" y="560" class="white small">Modular local production hubs for</text><text x="55" y="579" class="white small">customized, low-volume goods near users.</text><rect x="54" y="612" width="150" height="32" rx="8" class="pill"/><text x="72" y="633" class="white label">CASE STUDY →</text>
<circle cx="372" cy="525" r="28" fill="#21162d" stroke="#d2a3ff"/><text x="360" y="532" class="purple h3">✦</text><text x="416" y="506" class="purple label">ETHICAL ALGORITHMIC</text><text x="416" y="526" class="white h3">ARTISTRY</text><text x="343" y="560" class="white small">Human + AI cultural creation with explicit</text><text x="343" y="579" class="white small">attribution, permission and provenance.</text><rect x="342" y="612" width="150" height="32" rx="8" class="pill"/><text x="360" y="633" class="white label">CASE STUDY →</text>
<circle cx="660" cy="525" r="28" fill="#0b2130" stroke="#68cfff"/><text x="648" y="532" class="cyan h3">⌂</text><text x="704" y="506" class="cyan label">ADAPTIVE INFRASTRUCTURE</text><text x="704" y="526" class="white h3">RETROFITS</text><text x="631" y="560" class="white small">Modular upgrades for existing buildings,</text><text x="631" y="579" class="white small">focused on adaptability and function.</text><rect x="630" y="612" width="150" height="32" rx="8" class="pill"/><text x="648" y="633" class="white label">CASE STUDY →</text>
</g>

<!-- Proof layer -->
<rect x="910" y="430" width="230" height="232" rx="18" class="glass" filter="url(#shadow)"/>
<g class="sans"><text x="930" y="460" class="white h2">PROOF LAYER</text><text x="930" y="480" class="muted small">From concept to evidence</text>
<line x1="938" y1="505" x2="938" y2="627" stroke="#b8cad4" stroke-opacity=".38" stroke-width="2"/>
<circle cx="938" cy="522" r="6" fill="#77f0b1" filter="url(#glow)"/><text x="960" y="519" class="muted label">VERIFIED</text><text x="960" y="537" class="white small">Evidence pending</text>
<circle cx="938" cy="567" r="6" fill="#6be7ff" filter="url(#glow)"/><text x="960" y="564" class="cyan label">PILOT</text><text x="960" y="582" class="white small">3 pilot paths defined</text>
<circle cx="938" cy="612" r="6" fill="#f6c66b" filter="url(#glow)"/><text x="960" y="609" class="gold label">CONCEPTUAL</text><text x="960" y="627" class="white small">3 bounded theses</text>
</g>

<!-- Case study -->
<rect x="34" y="694" width="1106" height="300" rx="20" class="glass" filter="url(#shadow)"/>
<g class="sans"><text x="54" y="727" class="white h2">CASE STUDY EXAMPLE  •  HYPER-LOCAL MICRO-MANUFACTURING</text>
<line x1="54" y1="744" x2="1120" y2="744" stroke="#d8e7ef" stroke-opacity=".18"/>
</g>
<g class="sans">
<rect x="50" y="760" width="200" height="210" rx="14" class="pill"/><text x="66" y="788" class="white label">1. PROBLEM</text><text x="66" y="818" class="white small">Customized, low-volume parts</text><text x="66" y="837" class="white small">can suffer from slow centralized</text><text x="66" y="856" class="white small">fulfillment and long logistics.</text>
<rect x="258" y="760" width="240" height="210" rx="14" class="pill"/><text x="274" y="788" class="white label">2. OPERATING MODEL</text><text x="274" y="820" class="cyan small">Digital design</text><text x="346" y="846" class="white h3">→</text><text x="382" y="820" class="cyan small">Local cell</text><text x="310" y="882" class="white h3">↓</text><text x="274" y="912" class="cyan small">QA + receipt</text><text x="370" y="912" class="cyan small">Local delivery</text>
<rect x="506" y="760" width="210" height="210" rx="14" class="pill"/><text x="522" y="788" class="white label">3. BOUNDARY</text><text x="522" y="819" class="white small">• Local production capacity</text><text x="522" y="841" class="white small">• Qualified equipment</text><text x="522" y="863" class="white small">• Explicit manufacturing rules</text><text x="522" y="885" class="white small">• No wholesale supply-chain</text><text x="534" y="905" class="white small">redesign required</text>
<rect x="724" y="760" width="196" height="210" rx="14" class="pill"/><text x="740" y="788" class="white label">4. PILOT</text><text x="740" y="819" class="white small">Qualify two local printers</text><text x="740" y="841" class="white small">for one replacement part.</text><text x="740" y="872" class="muted small">Measure:</text><text x="740" y="894" class="white small">lead time • quality</text><text x="740" y="916" class="white small">landed cost • repeatability</text>
<rect x="928" y="760" width="196" height="210" rx="14" class="pill"/><text x="944" y="788" class="white label">5. VERIFICATION</text><text x="944" y="821" class="green body">Machine</text><text x="944" y="845" class="green body">Material</text><text x="944" y="869" class="green body">Tolerance</text><text x="944" y="893" class="green body">Operator</text><text x="944" y="917" class="green body">QA receipt</text><text x="944" y="947" class="muted small">No invented performance metrics.</text>
</g>

<!-- Bottom cards -->
<rect x="34" y="1020" width="310" height="265" rx="18" class="glass" filter="url(#shadow)"/><rect x="356" y="1020" width="430" height="265" rx="18" class="glass" filter="url(#shadow)"/><rect x="798" y="1020" width="342" height="265" rx="18" class="glass" filter="url(#shadow)"/>
<g class="sans"><text x="54" y="1053" class="gold h2">INSIGHTS</text><text x="54" y="1091" class="white small">◉ Trust is designed into the boundary.</text><text x="54" y="1123" class="white small">◉ Local execution needs explicit scope.</text><text x="54" y="1155" class="white small">◉ Attribution strengthens AI creativity.</text><text x="54" y="1187" class="white small">◉ Adaptable systems outlive rigid ones.</text><text x="54" y="1219" class="white small">◉ Verification separates claim from proof.</text></g>
<g class="sans"><text x="378" y="1053" class="gold h2">COLLABORATE</text><text x="378" y="1078" class="muted small">Three concrete ways to move a concept forward.</text>
<rect x="378" y="1100" width="120" height="142" rx="14" class="pill"/><text x="395" y="1130" class="green label">PILOT</text><text x="395" y="1150" class="white label">PARTNER</text><text x="395" y="1180" class="white small">Test a bounded</text><text x="395" y="1198" class="white small">real-world use case.</text>
<rect x="510" y="1100" width="120" height="142" rx="14" class="pill"/><text x="527" y="1130" class="cyan label">TECHNICAL</text><text x="527" y="1150" class="white label">CONTRIBUTOR</text><text x="527" y="1180" class="white small">Build and refine</text><text x="527" y="1198" class="white small">the implementation.</text>
<rect x="642" y="1100" width="120" height="142" rx="14" class="pill"/><text x="659" y="1130" class="purple label">RESEARCH</text><text x="659" y="1150" class="white label">VALIDATION</text><text x="659" y="1180" class="white small">Test evidence and</text><text x="659" y="1198" class="white small">challenge assumptions.</text></g>
<g class="sans"><text x="820" y="1053" class="gold h2">ABOUT THE ORIGINATOR</text><circle cx="862" cy="1128" r="42" fill="#172c39" stroke="#f6c66b" stroke-opacity=".5"/><text x="842" y="1140" font-size="28" font-weight="800" class="gold">LF</text><text x="920" y="1100" class="white h3">Leandro Fajardo</text><text x="920" y="1126" class="muted small">Originator of the three venture</text><text x="920" y="1145" class="muted small">concepts and Trusted Transformation</text><text x="920" y="1164" class="muted small">Infrastructure portfolio framework.</text><text x="820" y="1210" class="gold body" font-style="italic">Build with boundaries. Verify outcomes.</text></g>

<!-- Footer -->
<rect x="34" y="1315" width="1106" height="86" rx="16" fill="#0a1720" stroke="#9fb4c1" stroke-opacity=".3"/>
<g class="sans"><text x="55" y="1353" font-size="28" font-weight="800" fill="url(#gold)">TT</text><text x="98" y="1345" class="white label">TRUSTED TRANSFORMATION INFRASTRUCTURE</text><text x="98" y="1365" class="muted small">Original concepts • Leandro Fajardo • github.com/leandro4979-hub</text><text x="978" y="1356" class="gold label">BUILD → VERIFY</text></g>
