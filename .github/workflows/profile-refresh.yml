name: Profile refresh

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Refresh profile marker
        shell: bash
        run: |
          DATE=$(date -u +%F)
          sed -i -E "s/<!-- PROFILE_REFRESH: [0-9]{4}-[0-9]{2}-[0-9]{2} -->/<!-- PROFILE_REFRESH: ${DATE} -->/" README.md

      - name: Commit when the marker changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Profile is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile"
          git push
